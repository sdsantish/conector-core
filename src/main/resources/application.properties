as400.host=${AS400_HOST:pub400.com}
as400.user=${AS400_USER:sdsantish}
as400.password=${AS400_PASSWORD}

# Pool, timeouts y circuit breaker: los valores por defecto están en AS400Config y se cambian con variables de
# entorno (AS400_POOL_MAX_CONNECTIONS, AS400_CALL_TIMEOUT, AS400_CIRCUIT_BREAKER_DELAY...). Ver README.

# Bulkhead: PCML que comparten un cupo propio de llamadas simultáneas, para que no agoten el pool.
# as400.bulkhead.consultas.max-concurrent=3
# as400.bulkhead.consultas.pcmls=clicon,pruebapcml

# Caché de respuestas, solo para programas de consulta. La respuesta puede tener hasta "ttl" de antigüedad.
# as400.cache.clicon.ttl=5m
# as400.cache.clicon.max-entries=1000

%test.as400.host=localhost
%test.as400.user=test
%test.as400.password=test
%test.as400.pool.acquire-timeout=200ms
%test.as400.circuit-breaker.request-volume-threshold=4
%test.as400.circuit-breaker.delay=1h
%test.as400.bulkhead.lentos.max-concurrent=1
%test.as400.bulkhead.lentos.pcmls=suma
%test.as400.cache.saludo.ttl=1m
